# The two Secrets the base expects (postgres-credentials, mongo-credentials), copied from
# AWS Secrets Manager by External Secrets. Terraform (envs/prod) keeps two secrets per
# database: the credentials (username, password) and the endpoint (host, port, dbname).
# Each ExternalSecret merges the fields it needs from both into ONE Kubernetes Secret,
# under the environment variable names the app reads (src/config.py).
#
# Every field is named explicitly (data + remoteRef.property): the prod role may only read
# secret values (GetSecretValue), so never `dataFrom.find` (needs ListSecrets) or
# `metadataPolicy: Fetch` (needs DescribeSecret). The ports are not mapped: the base
# ConfigMap has the same fixed ones (5432, 27017).
#
# The pods read these values only when they start. After a password change (envs/prod),
# copy the new values now instead of at the next hourly refresh, then restart the pods:
#   kubectl -n prod annotate externalsecret --all force-sync=$(date +%s) --overwrite
#   kubectl -n prod get externalsecrets      # wait until LAST SYNC is a few seconds old
#   kubectl -n prod rollout restart deployment
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager          # created by Terraform (envs/prod) in this namespace
  target:
    name: postgres-credentials
    creationPolicy: Owner              # deleted together with this ExternalSecret
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: cryptobot/prod/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: cryptobot/prod/postgres
        property: password
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: cryptobot/prod/postgres-endpoint
        property: host
    - secretKey: POSTGRES_DB
      remoteRef:
        key: cryptobot/prod/postgres-endpoint
        property: dbname
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: mongo-credentials
    creationPolicy: Owner
  data:
    - secretKey: MONGO_USER
      remoteRef:
        key: cryptobot/prod/mongo
        property: username
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: cryptobot/prod/mongo
        property: password
    - secretKey: MONGO_HOST
      remoteRef:
        key: cryptobot/prod/mongo-endpoint
        property: host
    - secretKey: MONGO_DB
      remoteRef:
        key: cryptobot/prod/mongo-endpoint
        property: dbname
