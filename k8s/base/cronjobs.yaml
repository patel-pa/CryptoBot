# The scheduled jobs (decision 5): the two commands of src/cli.py. Their exit
# code is the Job's result (0 = succeeded, else failed), which monitoring watches.
# Run one now instead of waiting for the schedule:
#   kubectl create job --from=cronjob/ingest ingest-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
  labels:
    app.kubernetes.io/name: ingest
spec:
  schedule: "*/15 * * * *"                   # every 15 minutes
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid                  # never two runs at the same time
  startingDeadlineSeconds: 300               # a run missed by more than 5 min is skipped
  successfulJobsHistoryLimit: 3              # keep the last runs for `kubectl logs`
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1                        # one retry; the next run comes in 15 min anyway
      activeDeadlineSeconds: 1800            # a hung run is stopped after 30 min
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingest
        spec:
          restartPolicy: Never
          serviceAccountName: cryptobot
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              image: cryptobot-app
              command: ["python", "-m", "src.cli", "ingest"]
              envFrom:
                - configMapRef:
                    name: cryptobot-config
                - secretRef:
                    name: postgres-credentials   # Postgres only
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/app
          volumes:
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retrain
  labels:
    app.kubernetes.io/name: retrain
spec:
  schedule: "0 3 * * *"                      # daily at 03:00 UTC
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retrain
        spec:
          restartPolicy: Never
          serviceAccountName: retrain        # writes the model to S3 (EKS Pod Identity)
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retrain
              image: cryptobot-app
              command: ["python", "-m", "src.cli", "retrain"]
              envFrom:
                - configMapRef:
                    name: cryptobot-config
                - secretRef:
                    name: postgres-credentials
              resources:
                requests:
                  cpu: 100m
                  memory: 384Mi
                limits:
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/app
          volumes:
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
