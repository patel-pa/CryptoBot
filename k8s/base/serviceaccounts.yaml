# One ServiceAccount per AWS permission: in Week 2, EKS Pod Identity links `api`
# to an IAM role that may read the model in S3, and `retrain` to one that may
# write it. Every other pod runs as `cryptobot`, which gets no AWS access.
# No pod calls the Kubernetes API, so none gets a Kubernetes API token. (EKS Pod
# Identity mounts its own separate token; to confirm when it is set up.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retrain
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cryptobot
automountServiceAccountToken: false
