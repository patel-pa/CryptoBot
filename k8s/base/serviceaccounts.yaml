# One ServiceAccount per AWS permission: on EKS, Pod Identity (Terraform, envs/*)
# links `api` to an IAM role that may read the model in S3, and `retrain` to one
# that may write it. Every other pod runs as `cryptobot`, which gets no AWS access.
# No pod calls the Kubernetes API, so none gets a Kubernetes API token. Pod Identity
# still works: its webhook mounts its own token (audience pods.eks.amazonaws.com),
# meant for the Pod Identity agent, not for the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retrain
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cryptobot
automountServiceAccountToken: false
