# CI: lint + tests on every push/PR, and verify the Docker image builds.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # slim runtime deps (no Jupyter) — enough to import src and run the tests
          pip install -r requirements-docker.txt

      - name: Lint with flake8
        run: |
          # fail the build only on syntax errors / undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,notebooks
          # full lint as warnings only (does not fail the build)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,notebooks

      - name: Run tests
        run: pytest -v

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the application image
        run: docker build -t cryptobot-app:ci .
