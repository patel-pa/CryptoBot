# The checks every image must pass before it may go to Amazon ECR, defined once for both
# workflows: ci.yml runs them on every branch except dev and main, cd.yml's image job on dev,
# right before it pushes the image it scanned. Needs the repository checked out (the build
# context). No AWS credentials exist yet, and the containers it starts get none of the job's
# environment (no -e): only the build context or the saved image.
name: Test, build and scan the image
description: ruff and pytest in the image's test stage, then the runtime image, scanned by Trivy (fails on any CRITICAL vulnerability)

inputs:
  tag:
    description: Tag of the runtime image to build, as in cryptobot-app:<tag>
    required: true

runs:
  using: composite
  steps:
    - name: Lint and test (the image's test stage)
      shell: bash
      run: |
        docker build --target test -t cryptobot-test .
        docker run --rm cryptobot-test

    - name: Build the runtime image
      shell: bash
      env:
        TAG: ${{ inputs.tag }}              # through env: never pasted into the script
      run: docker build --target runtime -t "cryptobot-app:$TAG" .

    # Trivy reads a saved copy of the image: it gets no Docker socket (that would mean root on
    # the runner and write access to the image that cd.yml pushes next).
    - name: Scan it with Trivy (fails on any CRITICAL vulnerability)
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        # Trivy as a container image pinned by digest; its signature was checked with cosign
        # (signed by Aqua's reusable-release.yaml at tag v0.76.2). Not the trivy-action: its
        # version tags were hijacked in March 2026. The same pin is in ci.yml (config scan).
        TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      run: |
        docker save "cryptobot-app:$TAG" -o "$RUNNER_TEMP/image.tar"
        mkdir -p "$RUNNER_TEMP/trivy-cache"   # the vulnerability database, downloaded once
        trivy() {
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --input /image.tar --scanners vuln --no-progress --disable-telemetry \
            --skip-version-check "$@"
        }
        # Information only: what a newer package or base image would fix today.
        echo "::group::HIGH and CRITICAL vulnerabilities that have a fix (information)"
        trivy --severity HIGH,CRITICAL --ignore-unfixed
        echo "::endgroup::"
        # The gate.
        trivy --severity CRITICAL --exit-code 1 --skip-db-update
        rm "$RUNNER_TEMP/image.tar"
