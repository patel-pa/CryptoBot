# Tool settings only. The app's dependencies stay in requirements-docker.txt,
# the development tools in requirements-dev.txt.

[tool.ruff]
line-length = 127                    # the limit of the earlier flake8 setup, kept
target-version = "py311"             # the Python version of the Docker image
extend-exclude = ["notebooks"]       # exploration notebooks, not production code

[tool.ruff.lint]
# E, W: pycodestyle   F: pyflakes   I: import order
# B: bugbear (likely bugs)   UP: newer syntax for the target Python version
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]                   # the repo root, so tests can `import src...`
testpaths = ["tests"]
