# ===========================================================================
# CryptoBot — full stack in one command:   docker compose up --build
#
#   postgres   : historical candle store
#   mongodb    : live closed-candle store
#   init       : (one-shot) create the Postgres table + Mongo index, then exit
#   historical : (one-shot) backfill / catch up historical candles, then exit
#   streamer   : (always-on) live Binance WebSocket -> MongoDB
#   api        : (always-on) FastAPI  -> http://localhost:8000/docs
#   dashboard  : (always-on) Streamlit -> http://localhost:8501
# ===========================================================================

# Shared config for every Python app container (merged in below with "<<: *app").
x-app: &app
  build: .
  image: cryptobot-app          # built once, reused by all app services
  env_file: .env                # POSTGRES_USER/PASSWORD/DB, MONGO_USER/PASSWORD/DB
  environment:
    # Inside the Docker network, services reach the databases by SERVICE NAME
    # (not localhost) on their INTERNAL ports. These override the .env values.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    MONGO_HOST: mongodb
    MONGO_PORT: 27017
    # The streamer calls POST /predict here after each closed candle. Set in this
    # shared block: a service's own `environment:` would REPLACE the lines above.
    API_BASE: http://api:8000
  # Run the LIVE host source in every COMPOSE-managed app container, so edits to
  # src/ take effect on the next container start/run — no `docker compose build`.
  # (Services that declare their own `volumes:` below must re-list this line: a
  # service-level volumes block replaces this inherited one rather than merging.)
  # NOTE: this does NOT reach Airflow's DAG tasks — they run in fresh containers
  # launched by DockerOperator from the baked cryptobot-app image. After editing
  # src/ that a DAG runs, `docker compose build` for it to take effect there.
  volumes:
    - ./src:/app/src
  networks:
    - pipeline_network

services:
  # ----------------------------- Databases -----------------------------
  postgres:
    image: postgres:15
    container_name: cryptobot-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pipeline_network
    healthcheck:
      # Must pass -d: without it, pg_isready connects to a DB named after the
      # USER (cryptobot_user), which doesn't exist, spamming the log with
      # "FATAL: database \"cryptobot_user\" does not exist" every interval.
      # Targeting the real DB keeps the check clean (and still exits 0 = healthy).
      # Also -h localhost to force a TCP probe (not the Unix socket, which answers
      # during initdb's bootstrap before TCP:5432 is really listening). start_period
      # excludes that first-boot window, so dependents can't start against a DB
      # that isn't truly accepting TCP connections yet.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:6
    container_name: cryptobot-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pipeline_network
    healthcheck:
      # start_period gives mongo's first-boot bootstrap (initdb + root-user/auth
      # setup) time to finish before failed pings count against it.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------- One-shot: create schema + indexes -------------------
  init:
    <<: *app
    container_name: cryptobot-init
    command: python -m src.storage.init_db
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # ------------------- One-shot: backfill historical data -------------------
  # Idempotent (resumes from the last stored candle), so it's safe to run on
  # every `up`. Other services don't wait for it — the dashboard is usable
  # while this catches the database up in the background.
  historical:
    <<: *app
    container_name: cryptobot-historical
    command: python -m src.collection.fetch_historical
    restart: "no"
    depends_on:
      init:
        condition: service_completed_successfully

  # ------------------- Always-on: live stream -> MongoDB -------------------
  streamer:
    <<: *app
    container_name: cryptobot-streamer
    command: python -m src.collection.stream_live
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  # ------------------- Always-on: FastAPI -------------------
  api:
    <<: *app
    container_name: cryptobot-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"      # http://localhost:8000/docs  (change the LEFT port if 8000 is busy)
    volumes:
      - models_data:/app/models     # read the model Airflow retrains (shared volume)
      - ./src:/app/src              # live host code (re-listed; see x-app note)
    depends_on:
      init:
        condition: service_completed_successfully

  # ------------------- Always-on: Streamlit dashboard -------------------
  dashboard:
    <<: *app
    container_name: cryptobot-dashboard
    # fileWatcherType=none DISABLES file watching entirely. On a Windows -> WSL2
    # bind mount, ANY watcher (poll or the default watchdog) sees phantom
    # file-change events and Streamlit restarts its process every ~30s — an
    # endless crash loop. A container doesn't need live-watch anyway: the bind
    # mount below still runs your LIVE code, you just restart to deploy edits —
    # `docker compose restart dashboard` (or press "R" in an open browser tab).
    command: streamlit run src/visualization/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.fileWatcherType=none
    restart: unless-stopped
    environment:
      API_BASE: http://api:8000     # reach the API container by its service name
    ports:
      - "8501:8501"      # http://localhost:8501
    volumes:
      # Run the LIVE host source, not the copy baked into the image. Edits to
      # src/ take effect on the next Streamlit rerun — no `docker compose --build`.
      - ./src:/app/src
    depends_on:
      - api

  # ------------------- Orchestration: Apache Airflow -------------------
  # Airflow only ORCHESTRATES. Each task launches a container from the
  # cryptobot-app image (via DockerOperator), so Airflow needs none of the
  # project's data dependencies. DAGs live in airflow/dags/:
  #   cryptobot_ingest — fetch_historical every 15 min
  #   cryptobot_train  — fetch + retrain the model daily
  # IMPORTANT: those DAG task containers run the src/ code BAKED INTO the image,
  # NOT the ./src bind mount the compose services use. So after editing anything
  # under src/ that a DAG runs (fetch_historical, train_model), run
  # `docker compose build` — otherwise the ingest/train DAGs silently run OLD code.
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: cryptobot-airflow
    container_name: cryptobot-airflow
    restart: unless-stopped
    # Clean stale *.pid files (persisted in the airflow_data volume) before boot —
    # otherwise the webserver refuses to start with "Already running on PID …".
    command: bash -c "rm -f /opt/airflow/*.pid && exec airflow standalone"
    env_file: .env                  # gives the DAGs the DB user/password/name
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"  # new DAGs start UNPAUSED (active) — survives a down -v, no manual unpausing
      # --- Keep the scheduler quiet while idle (big drop in background CPU) ---
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "120"   # re-parse DAGs every 2 min, not 30s
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "300"       # scan for new DAG files every 5 min
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"             # single DAG-parsing worker
      AIRFLOW__CORE__PARALLELISM: "4"                        # cap total concurrent tasks
      # --- Webserver reliability on a resource-constrained WSL2 host ---
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"   # don't kill the webserver if gunicorn boots slowly
      AIRFLOW__WEBSERVER__WORKERS: "2"                        # fewer gunicorn workers = faster boot, less RAM
    ports:
      # Bind to loopback only: Airflow holds host-root via the docker.sock mount
      # below, so its UI must NOT be reachable from the LAN. localhost still works.
      # Host port 8081 (not 8080) because Apache/httpd already occupies 8080 here.
      - "127.0.0.1:8081:8080"       # Airflow UI -> http://localhost:8081
    volumes:
      - ./airflow/dags:/opt/airflow/dags           # edit DAGs without rebuilding
      - airflow_data:/opt/airflow                   # persist Airflow's metadata DB
      - /var/run/docker.sock:/var/run/docker.sock   # lets DockerOperator launch task containers
    networks:
      - pipeline_network
    # Airflow's DAG tasks run in their OWN containers (DockerOperator), so it only
    # needs the schema to exist: it waits for `init` to finish, nothing more. It
    # deliberately does NOT wait for `historical` — a one-shot backfill that fails
    # (e.g. a transient network error) must never permanently block the orchestrator
    # from booting. You normally start Airflow on its own anyway, by which time the
    # backfill has long finished.
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  pipeline_network:
    name: cryptobot_network         # stable name so DockerOperator can attach tasks

volumes:
  postgres_data:
  mongo_data:
  models_data:
    name: cryptobot_models          # stable name for the shared model volume
  airflow_data:
