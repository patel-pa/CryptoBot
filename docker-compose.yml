# ===========================================================================
# CryptoBot — full stack in one command:   docker compose up --build
#
#   postgres   : historical candle store
#   mongodb    : live closed-candle store
#   init       : (one-shot) create the Postgres table + Mongo index, then exit
#   historical : (one-shot) backfill / catch up historical candles, then exit
#   streamer   : (always-on) live Binance WebSocket -> MongoDB
#   api        : (always-on) FastAPI  -> http://localhost:8000/docs
#   dashboard  : (always-on) Streamlit -> http://localhost:8501
#
# No scheduler here: `historical` catches up on every `up`; train by hand with
#   docker compose run --rm api python -m src.cli retrain
# On Kubernetes (v2, in progress), CronJobs will run `ingest` every 15 min and
# `retrain` daily.
# ===========================================================================

# Shared config for every Python app container (merged in below with "<<: *app").
x-app: &app
  build:
    context: .
    target: runtime             # the production stage: no test tools in the image
  image: cryptobot-app          # built once, reused by all app services
  env_file: .env                # POSTGRES_USER/PASSWORD/DB, MONGO_USER/PASSWORD/DB
  environment:
    # Inside the Docker network, services reach the databases by SERVICE NAME
    # (not localhost) on their INTERNAL ports. These override the .env values.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    MONGO_HOST: mongodb
    MONGO_PORT: 27017
    # The streamer calls POST /predict here after each closed candle. Set in this
    # shared block: a service's own `environment:` would REPLACE the lines above.
    API_BASE: http://api:8000
  # Run the LIVE host source in every COMPOSE-managed app container, so edits to
  # src/ take effect on the next container start/run — no `docker compose build`.
  # (Services that declare their own `volumes:` below must re-list this line: a
  # service-level volumes block replaces this inherited one rather than merging.)
  volumes:
    - ./src:/app/src
  networks:
    - pipeline_network

services:
  # ----------------------------- Databases -----------------------------
  # Same major versions as the AWS databases (RDS PostgreSQL 18, DocumentDB 8.0).
  # After a major version change, recreate the volumes (docker compose down -v):
  # data files of an older major version may not start on the new one.
  postgres:
    image: postgres:18
    container_name: cryptobot-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Since 18 the image keeps its data in /var/lib/postgresql/18/docker and
      # refuses a volume on the old path /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    networks:
      - pipeline_network
    healthcheck:
      # Must pass -d: without it, pg_isready connects to a DB named after the
      # USER (cryptobot_user), which doesn't exist, spamming the log with
      # "FATAL: database \"cryptobot_user\" does not exist" every interval.
      # Targeting the real DB keeps the check clean (and still exits 0 = healthy).
      # Also -h localhost to force a TCP probe (not the Unix socket, which answers
      # during initdb's bootstrap before TCP:5432 is really listening). start_period
      # excludes that first-boot window, so dependents can't start against a DB
      # that isn't truly accepting TCP connections yet.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:8.0
    container_name: cryptobot-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pipeline_network
    healthcheck:
      # start_period gives mongo's first-boot bootstrap (initdb + root-user/auth
      # setup) time to finish before failed pings count against it.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------- One-shot: create schema + indexes -------------------
  init:
    <<: *app
    container_name: cryptobot-init
    command: python -m src.storage.init_db
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # ------------------- One-shot: backfill historical data -------------------
  # Idempotent (resumes from the last stored candle), so it's safe to run on
  # every `up`. Other services don't wait for it — the dashboard is usable
  # while this catches the database up in the background.
  historical:
    <<: *app
    container_name: cryptobot-historical
    command: python -m src.cli ingest   # the command the Kubernetes ingest CronJob will run
    restart: "no"
    depends_on:
      init:
        condition: service_completed_successfully

  # ------------------- Always-on: live stream -> MongoDB -------------------
  streamer:
    <<: *app
    container_name: cryptobot-streamer
    command: python -m src.collection.stream_live
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  # ------------------- Always-on: FastAPI -------------------
  api:
    <<: *app
    container_name: cryptobot-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"      # http://localhost:8000/docs  (change the LEFT port if 8000 is busy)
    volumes:
      - models_data:/app/models     # the local model file: written by `python -m src.cli retrain`
      - ./src:/app/src              # live host code (re-listed; see x-app note)
    depends_on:
      init:
        condition: service_completed_successfully

  # ------------------- Always-on: Streamlit dashboard -------------------
  dashboard:
    <<: *app
    container_name: cryptobot-dashboard
    # fileWatcherType=none DISABLES file watching entirely. On a Windows -> WSL2
    # bind mount, ANY watcher (poll or the default watchdog) sees phantom
    # file-change events and Streamlit restarts its process every ~30s — an
    # endless crash loop. A container doesn't need live-watch anyway: the bind
    # mount below still runs your LIVE code, you just restart to deploy edits —
    # `docker compose restart dashboard` (or press "R" in an open browser tab).
    command: streamlit run src/visualization/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.fileWatcherType=none
    restart: unless-stopped
    environment:
      API_BASE: http://api:8000     # reach the API container by its service name
    ports:
      - "8501:8501"      # http://localhost:8501
    volumes:
      # Run the LIVE host source, not the copy baked into the image. Edits to
      # src/ take effect on the next Streamlit rerun — no `docker compose --build`.
      - ./src:/app/src
    depends_on:
      - api

networks:
  pipeline_network:

volumes:
  postgres_data:
  mongo_data:
  models_data:
